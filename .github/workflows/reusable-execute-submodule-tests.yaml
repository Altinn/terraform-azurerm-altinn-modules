name: Reusable Execute Terratests

on:
    workflow_call:
        secrets:
            client_id:
                description: 'Azure Client ID'
                required: true
            subscription_id:
                description: 'Azure Subscription ID'
                required: true
            tenant_id:
                description: 'Azure Tenant ID'
                required: true
        inputs:
            module_folder:
                description: 'Folder containing the module to test, relative to the modules directory'
                required: true
                type: string
            test_folder:
                description: 'Folder containing Terratests, relative to the tests directory'
                required: true
                type: string

permissions:
    id-token: write
    contents: read

jobs:
    run-terratests:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Set up Go
          uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
          with:
            go-version-file: 'tests/go.mod'
            cache-dependency-path: 'tests/go.mod'

        - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
          with:
            terraform_version: 1.10.3
            terraform_wrapper: false 
            
        - name: Run linter
          uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
          if: false
          with:
            version: v2.12.2
            working-directory: tests/${{ inputs.test_folder }}

        - name: Terraform Format Check module folder
          shell: bash
          working-directory: modules/${{ inputs.module_folder }}
          run: terraform fmt -check

        - name: Terraform Format Check test folder
          shell: bash
          working-directory: tests/${{ inputs.test_folder }}
          run: terraform fmt -check
          
        - name: Azure login
          uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
          with:
            client-id: ${{ secrets.client_id }}
            tenant-id: ${{ secrets.tenant_id }}
            subscription-id: ${{ secrets.subscription_id }}
            
        - name: Run Terratests
          env:
            ARM_CLIENT_ID: ${{ secrets.client_id }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.subscription_id }}
            ARM_TENANT_ID: ${{ secrets.tenant_id }}
            ARM_USE_OIDC: true
          working-directory: tests/${{ inputs.test_folder }}
          run: |
            go test -v ./... -timeout 30m -count=1